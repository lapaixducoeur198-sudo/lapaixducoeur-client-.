name: Build Client APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Create Clean Flutter Project in Temp Folder
        run: |
          flutter create temp_app --org com.lapaixducoeur --project-name lapaixducoeur_client --platforms=android
          
          python3 -c "
          path = 'temp_app/android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          import re
          new_content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 24', content)
          with open(path, 'w') as f:
              f.write(new_content)
          print('minSdkVersion mis à 24 dans le template android')
          "

          cp -r temp_app/android ./
          cp -r temp_app/ios ./ 2>/dev/null || true
          cp -r temp_app/web ./ 2>/dev/null || true
          rm -rf temp_app

      - name: Update pubspec.yaml Dependencies
        run: |
          cat << 'EOF' > pubspec.yaml
          name: lapaixducoeur_client
          description: A new Flutter project.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_map: ^6.1.0
            latlong2: ^0.9.0
            geolocator: ^10.1.0
            http: ^1.2.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Write Configuration and Main Code
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/config.dart
          class Config {
            static const String serveurUrl = 'https://api.lapaixducoeur.com';
          }
          EOF

          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter_map/flutter_map.dart';
          import 'package:latlong2/latlong.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'config.dart';

          void main() {
            runApp(const LaPaixDuCoeurClientApp());
          }

          class LaPaixDuCoeurClientApp extends StatelessWidget {
            const LaPaixDuCoeurClientApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'La Paix du Cœur - Client',
                theme: ThemeData(primarySwatch: Colors.blue),
                home: const ClientMapScreen(),
                debugShowCheckedModeBanner: false,
              );
            }
          }

          class ClientMapScreen extends StatefulWidget {
            const ClientMapScreen({super.key});

            @override
            State<ClientMapScreen> createState() => _ClientMapScreenState();
          }

          class _ClientMapScreenState extends State<ClientMapScreen> {
            final MapController _mapController = MapController();
            LatLng _currentPosition = const LatLng(5.3600, -4.0083);
            bool _isLoadingLocation = true;
            final TextEditingController _destinationController = TextEditingController(text: 'Plateau, Abidjan');

            @override
            void initState() {
              super.initState();
              _determinePosition();
            }

            Future<void> _determinePosition() async {
              bool serviceEnabled = await Geolocator.isLocationServiceEnabled();
              if (!serviceEnabled) {
                setState(() => _isLoadingLocation = false);
                return;
              }

              LocationPermission permission = await Geolocator.checkPermission();
              if (permission == LocationPermission.denied) {
                permission = await Geolocator.requestPermission();
                if (permission == LocationPermission.denied) {
                  setState(() => _isLoadingLocation = false);
                  return;
                }
              }

              Position position = await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high);
              setState(() {
                _currentPosition = LatLng(position.latitude, position.longitude);
                _isLoadingLocation = false;
              });

              try {
                _mapController.move(_currentPosition, 15.0);
              } catch (_) {}
            }

            Future<void> _commanderCourse() async {
              try {
                final response = await http.post(
                  Uri.parse('${Config.serveurUrl}/api/rides'),
                  headers: {'Content-Type': 'application/json'},
                  body: jsonEncode({
                    'clientName': 'Client Test',
                    'pickup': '${_currentPosition.latitude}, ${_currentPosition.longitude}',
                    'destination': _destinationController.text,
                  }),
                );

                if (response.statusCode == 201) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Course commandée avec succès !')),
                  );
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Erreur : $e')),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('La Paix du Cœur - Client'),
                  backgroundColor: Colors.blueAccent,
                ),
                body: Stack(
                  children: [
                    FlutterMap(
                      mapController: _mapController,
                      options: MapOptions(
                        initialCenter: _currentPosition,
                        initialZoom: 14.0,
                      ),
                      children: [
                        TileLayer(
                          urlTemplate: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                          userAgentPackageName: 'com.lapaixducoeur.client',
                        ),
                        MarkerLayer(
                          markers: [
                            Marker(
                              point: _currentPosition,
                              width: 80,
                              height: 80,
                              child: const Icon(Icons.location_pin, color: Colors.red, size: 40),
                            ),
                          ],
                        ),
                      ],
                    ),
                    if (_isLoadingLocation)
                      Container(
                        color: Colors.black45,
                        child: const Center(child: CircularProgressIndicator(color: Colors.white)),
                      ),
                    Positioned(
                      bottom: 20,
                      left: 20,
                      right: 20,
                      child: Card(
                        elevation: 6,
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                        child: Padding(
                          padding: const EdgeInsets.all(16.0),
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              const Text('Où allons-nous ?', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                              const SizedBox(height: 10),
                              TextField(
                                controller: _destinationController,
                                decoration: InputDecoration(
                                  labelText: 'Destination',
                                  prefixIcon: const Icon(Icons.location_on, color: Colors.red),
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(10)),
                                ),
                              ),
                              const SizedBox(height: 15),
                              SizedBox(
                                width: double.infinity,
                                child: ElevatedButton(
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: Colors.blueAccent,
                                    padding: const EdgeInsets.symmetric(vertical: 14),
                                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                                  ),
                                  onPressed: _commanderCourse,
                                  child: const Text('Commander un Chauffeur', style: TextStyle(fontSize: 16, color: Colors.white, fontWeight: FontWeight.bold)),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-client-release
          path: build/app/outputs/flutter-apk/app-release.apk
